name: Autorino
options:
  bundleIdPrefix: com.autorino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Autorino:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Autorino
    info:
      path: Autorino/Info.plist
      properties:
        CFBundleDisplayName: Autorino
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dropbox OAuth (PKCE) redirect. Fixed scheme, not derived from the
        # App Key — the key itself is entered at runtime in Settings and
        # kept in the Keychain (see DropboxConfig.swift). Register
        # db-autorino://oauth2redirect once as a Redirect URI in the
        # Dropbox App Console (see README-iOS.md); it never needs to change.
        CFBundleURLTypes:
          - CFBundleURLName: com.autorino.app.dropbox
            CFBundleURLSchemes:
              - db-autorino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autorino.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

